<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>醸造百選の陣取り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f5eedd; --edge: #e9dfc8; --ink: #2b2620; --mute: #8a7e6e; --line: #d8cdb6;
    --tile: #eee6d2; --dest: #9b2f2a; --btn: #8c3a2b;
    /* 席の色（県の塗り・駒）：紅・藍・若草・山吹。明るさに段差（藍→紅→若草→山吹→持ち主なしの順に淡く）＝白黒・色覚の違いでも見分ける */
    --c0: #e39c8f; --c1: #6a87bb; --c2: #b2d48f; --c3: #f2db8a;
    --k0: #a8392c; --k1: #2f4f86; --k2: #4f7a2c; --k3: #a8750f; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1f1c17; --edge: #191612; --ink: #e6ddcc; --mute: #9d917f; --line: #3a342b;
      --tile: #2a251e; --dest: #c4554b; --btn: #d99a7e;
      --c0: #8f3f33; --c1: #263d6b; --c2: #557a30; --c3: #94761f;
      --k0: #f0a596; --k1: #a9c3f0; --k2: #bfe09a; --k3: #f3d27f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--edge); color: var(--ink); overflow: hidden;
    font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif; -webkit-text-size-adjust: 100%; }
  /* 1画面：上に盤、下に操作帯。ページはスクロールしない */
  .leaf { max-width: 48rem; margin: 0 auto; height: 100vh; height: 100dvh; background: var(--paper);
    display: flex; flex-direction: column; overflow: hidden; }
  svg { flex: 1 1 0; min-height: 0; width: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  .tile { fill: var(--tile); stroke: var(--paper); stroke-width: 1.5; }
  .tile.o0 { fill: var(--c0); } .tile.o1 { fill: var(--c1); } .tile.o2 { fill: var(--c2); } .tile.o3 { fill: var(--c3); }
  .tile.mv { fill-opacity: .6; } /* まだ動く県（品が残っている）は淡く。取り尽くされて色が決まった県だけ濃い */
  .tile.dest { stroke: var(--dest); stroke-width: 6; }
  .ring { fill: none; stroke: var(--paper); stroke-width: 2; pointer-events: none; display: none; }
  .tile.dest ~ .ring { display: inline; }
  /* なぞった道：通った県を光らせ、線と印 */
  #trace { pointer-events: none; opacity: .6; } /* 県名が透けて読めるように */
  #trace polyline { fill: none; stroke: var(--dest); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  #trace circle { fill: var(--dest); }
  #trace.done circle { display: none; } /* 指したあとは線だけ（県名に点を重ねない） */
  /* 海の道：点線（この線に沿ってなぞると海を渡れる） */
  #sea line { stroke: var(--mute); stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; opacity: .7; pointer-events: none; }
  /* 選ぶ板：道で通った県に、板の見出しと同じ番号 */
  #nums { pointer-events: none; }
  #nums circle { fill: var(--dest); stroke: var(--paper); stroke-width: 1.5; }
  #nums text { font-size: calc(var(--lf, 13px) * .9); fill: var(--paper); }
  /* 貯めた色札：手番の人の分だけ、県名の上に小さな漢数字（3字の県は二行目の右）。縁を紙の色で抜いて、どの色の県の上でも読めるように */
  #chips { pointer-events: none; }
  #chips text { font-size: calc(var(--lf, 13px) * .6); paint-order: stroke; stroke: var(--paper); stroke-width: 2; stroke-linejoin: round; }
  /* 盤の左上（県のない海）の記録：取った品・奪った色・失った色札を一行ずつ。新しい行ほど下、古い行は淡く */
  #log, #score { pointer-events: none; }
  #log text, #score text { fill: var(--ink); } /* 右下の海に色の県の数（席ごとに一行） */
  #log .old { opacity: .5; }
  #log .box { fill: var(--tile); fill-opacity: .55; stroke: var(--line); stroke-width: 1; } /* 記録の箱（薄い枠で塗る） */
  #log .in { animation: pop .25s ease-out; }
  @keyframes pop { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #log .in { animation: none; } }
  #pcs { pointer-events: none; }
  #pcs circle { stroke: var(--paper); stroke-width: 1.5; }
  #pcs .now { stroke: var(--ink); stroke-width: 2; }
  .lbl { font-size: var(--lf, 13px); fill: var(--ink); pointer-events: none; }
  .band { flex: none; display: flex; flex-direction: column; min-height: 0;
    border-top: 1px solid var(--line); padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); }
  .stat { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-size: 14px; color: var(--mute); letter-spacing: .08em; }
  i.d { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
  /* 文は最大3行。高さを3行ぶん固定（行が増減しても盤が跳ねない） */
  .say { flex: none; margin: 4px 0 8px; line-height: 1.6; height: 4.8em; overflow: hidden; }
  .say div { overflow: hidden; }
  .say .in { animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  .say b { font-weight: 600; }
  .say .rule { color: var(--mute); }
  .band.setup .say { display: none; } /* はじめの画面は文が盤の左上なので、空の文の欄を畳む（「始める」で三行の固定に戻る） */
  .row { flex: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row .break { flex-basis: 100%; height: 0; }
  .row .seat { min-width: 3em; }
  .row button.mode { padding-left: 8px; padding-right: 8px; } /* 遊び方の三つを一行に（375幅） */
  .row input { font: inherit; font-size: 18px; width: 5em; padding: 6px 8px; letter-spacing: .3em; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 3px; }
  .row .err { color: var(--dest); font-size: 14px; }
  #warn { font-size: 11px; letter-spacing: 0; }
  /* はじめの画面の席：二列×二段（上に紅・若草、下に藍・山吹）。人数で帯の高さを変えない */
  .row .seats { flex-basis: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seats > div { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  .seats > .off { visibility: hidden; } /* 二人・三人で空く席。場所だけ残す */
  .seats button { width: 5.8em; padding-left: 0; padding-right: 0; text-align: center; } /* 人・CPU弱/中/強を同じ幅に */
  .band.pick { max-height: 55dvh; }
  .band.pick .say { height: 1.6em; } /* 選ぶ間の文は一行（板を広く） */
  .band.pick.ev .say { height: 3.2em; } /* 出来事があった手は二行（何が起きたか・効き目） */
  .band.pick.ev.at .say { height: 4.8em; } /* 目的地で出来事があった手だけ三行 */
  /* 振る前に県を触ったとき：一行目に県と色札（選ぶ板の見出しと同じ並び）、二・三行目に残っている品とコストの点 */
  .say .pv { display: flex; justify-content: space-between; gap: 8px; }
  .say .pv span { white-space: nowrap; } /* 語の途中で折らない */
  .nw { white-space: nowrap; } /* 品名とコストの点をひとかたまりに（品の間の「、」でだけ折る） */
  .say .pv-it span { white-space: nowrap; margin-right: 1em; }
  .say .pv i.d, .say .pv-it i.d { margin: 0 0 0 3px; }
  .say .tap { text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
  .tile.cand { stroke: var(--dest); stroke-width: 3; stroke-dasharray: 4 4; } /* 行事：目的地に選べる県 */ /* 選ぶ間も盤と道を半分近く残す */
  #acts.pick { flex: 1 1 auto; min-height: 0; flex-wrap: nowrap; flex-direction: column; align-items: stretch; }
  /* 選ぶ板：下からせり上がる。品が多いときだけ板の中でスクロール */
  .mk { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -14px; padding: 0 14px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); animation: fadein .18s ease-out; }
  .mk label { display: flex; align-items: center; gap: 8px; min-height: 40px; }
  .mk label + label, .mk .ph + label { border-top: 1px solid var(--line); }
  .mk .nm { flex: 1; min-width: 0; }
  .mk i.d { margin: 0 0 0 3px; } /* 色札一枚＝点一つ（品の右＝コスト・見出しの右＝その県の自分の色札。使う分は白抜き） */
  .mk label:has(input:disabled) { color: var(--mute); } /* 残りの色札では払えない品 */
  .mk .ph { font-size: 13px; color: var(--mute); letter-spacing: .1em; padding-top: 6px; display: flex; justify-content: space-between; }
  .mkb { flex: none; display: flex; gap: 8px; padding-top: 8px; }
  button { font: inherit; font-size: 15px; color: var(--btn); background: transparent; border: 1px solid var(--btn);
    border-radius: 3px; padding: 8px 14px; cursor: pointer; }
  button.sub { color: var(--mute); border-color: var(--line); }
  button.on { background: var(--btn); color: var(--paper); }
  button:disabled { cursor: default; opacity: .6; }
  a { color: inherit; }
  h1 { color: var(--ink); font-size: 17px; font-weight: 600; letter-spacing: .2em; margin: 2px 0 4px; }
  /* 「◯◯の番」：一台を回すときの一画面 */
  .pass { position: fixed; inset: 0; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .pass[hidden] { display: none; }
  .pass p { margin: 0; font-size: 28px; letter-spacing: .3em; }
  /* 帳面：結びで下から一覧（板の中だけスクロール） */
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: flex; align-items: flex-end; justify-content: center; }
  .shade[hidden] { display: none; }
  .sheet { width: 100%; max-width: 48rem; max-height: 75dvh; overflow-y: auto; background: var(--paper);
    padding: 0 16px calc(16px + env(safe-area-inset-bottom)); animation: fadein .18s ease-out; }
  /* 見出しと「閉じる」は板の上に留める（品が多くて板の中をスクロールしても閉じられる） */
  .sheet .hd { position: sticky; top: 0; background: var(--paper); padding: 12px 0 4px;
    display: flex; justify-content: space-between; align-items: baseline; color: var(--mute); font-size: 14px; letter-spacing: .1em; }
  .sheet h2 { font-size: 15px; font-weight: 600; letter-spacing: .15em; margin: 14px 0 0; }
  .sheet ul { margin: 4px 0 0; padding-left: 1.2em; line-height: 1.9; }
  .sheet li i.d { margin: 0 0 0 3px; } /* 品のコスト：色札一枚＝点一つ（選ぶ板と同じ） */
  .src { font-size: 12px; color: var(--mute); }
</style>
</head>
<body>
<div class="leaf">
  <svg id="map" viewBox="42 6 804 623" preserveAspectRatio="xMidYMid meet" role="group" aria-label="都道府県の盤"></svg>
  <div class="band">
    <div class="stat"><span id="when"></span><span id="warn"></span></div>
    <div class="say" id="say"></div>
    <div class="row" id="acts"></div>
  </div>
</div>
<div class="pass" id="pass" hidden><p id="passn"></p><button id="passb">始める</button></div>
<div class="shade" id="shade" hidden>
  <div class="sheet"><div class="hd"><span id="shn">帳面</span><button class="sub" id="shx">閉じる</button></div><div id="book"></div></div>
</div>
<script src="data/jozo_data.js"></script>
<script src="data/events.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script>
"use strict";
const DATA = window.JOZO_DATA, E = JintoriEngine(DATA, window.JOZO_EVENTS), AI = JintoriAI(E), $ = s => document.querySelector(s);
const K = E.kanji;
const COLORS = ["紅", "藍", "若草", "山吹"];
const KINDS = ["人", "やさしい", "ふつう", "つよい"]; // 席の選び：人か、コンピュータの強さ
const SEATLBL = { "人": "人", "やさしい": "CPU初級", "ふつう": "CPU中級", "つよい": "CPU上級" }; // 席のボタンの字
let g = null, setup = { n: 2, seat: ["人", "ふつう", "ふつう", "ふつう"], mode: "here", err: "" };
const POS = () => E.cur(g).pos;
// 手を指せる画面か：この端末で遊ぶときは人の番。通信対戦では自分の席の番で、自分の手の画面が出ている間だけ
const isHuman = () => !!g && !g.over && (NET ? NET.ui === "mine" && mine(g.cur) : E.cur(g).kind === "人");
const svg = $("#map"), CTR = {};
(function buildMap() { // 六角盤
  const R = 33, HW = Math.sqrt(3) / 2 * R, VS = 1.5 * R, MX = 44, MY = 40;
  const hex = (cx, cy, r) => [0,1,2,3,4,5].map(i => { const a = Math.PI / 180 * (60 * i - 90);
    return (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1); }).join(" ");
  let out = "";
  for (const [p, [q, r]] of Object.entries(DATA.tiles)) {
    const cx = (MX + q * HW).toFixed(1), cy = (MY + r * VS).toFixed(1);
    CTR[p] = [+cx, +cy];
    const lines = p.length >= 3 ? [p.slice(0, 2), p.slice(2)] : [p];
    const txt = lines.length === 1 ? `<tspan x="${cx}" dy=".36em">${p}</tspan>`
      : `<tspan x="${cx}" dy="-.14em">${lines[0]}</tspan><tspan x="${cx}" dy="1.04em">${lines[1]}</tspan>`;
    out += `<g data-p="${p}"><polygon class="tile" points="${hex(+cx, +cy, R - 1.5)}"></polygon>`
      + `<text class="lbl" x="${cx}" y="${cy}" text-anchor="middle">${txt}</text>`
      + `<polygon class="ring" points="${hex(+cx, +cy, R - 7)}"></polygon></g>`;
  }
  const sea = (DATA.sea || []).map(([a, b]) => { // 両端は県名にかからないよう六角の縁から
    const [ax, ay] = CTR[a], [bx, by] = CTR[b], L = Math.hypot(bx - ax, by - ay), c = Math.min(.45, 22 / L);
    const P = t => [(ax + (bx - ax) * t).toFixed(1), (ay + (by - ay) * t).toFixed(1)];
    const [x1, y1] = P(c), [x2, y2] = P(1 - c);
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>`; }).join("");
  svg.innerHTML = out + `<g id="sea">${sea}</g><g id="chips"></g><g id="pcs"></g><g id="trace"></g><g id="nums"></g><g id="log"></g><g id="score"></g>`;
})();
const TILES = [...svg.querySelectorAll("g[data-p]")], TRACE = $("#trace"), PCS = $("#pcs"), NUMS = $("#nums"), CHIPS = $("#chips"), LOG = $("#log"), SCORE = $("#score");
let LF = 13;
// 盤はふだん全国。なぞる間だけ、いる県から目の数で届く範囲に寄せる。県名の大きさ（LF）は全国のときの値のまま＝寄せると字も大きくなる
const FULL = [14, 6, 860, 650]; // 下にも余白（下寄せにしたので沖縄が線につかないように） // 左右に約二十八ずつ余白
svg.setAttribute("viewBox", FULL.join(" "));
svg.setAttribute("preserveAspectRatio", "xMidYMax meet"); // 盤は操作帯の線のすぐ上に。縦長の画面で余る高さは盤の上（題字・記録の側）にまとめる
let VB = FULL.slice(), anim = 0, zooming = false; // zooming＝寄せる・戻す動きの最中（この間は指の判定をしない）
const CALM = matchMedia("(prefers-reduced-motion: reduce)");
const setVB = v => { VB = v; svg.setAttribute("viewBox", v.map(n => n.toFixed(1)).join(" ")); };
function zoomTo(v) { // 0.25秒で寄せる・戻す（動きが苦手な設定では即時）
  cancelAnimationFrame(anim); zooming = false;
  const a = VB.slice();
  if (CALM.matches || a.every((n, i) => Math.abs(n - v[i]) < .5)) return setVB(v);
  const t0 = performance.now(); zooming = true;
  const tick = now => { const t = Math.min(1, (now - t0) / 250), k = 1 - (1 - t) ** 3;
    setVB(a.map((n, i) => n + (v[i] - n) * k)); if (t < 1) anim = requestAnimationFrame(tick); else zooming = false; };
  anim = requestAnimationFrame(tick);
}
// 届く範囲（目の数の歩数以内の県）が収まる枠。広すぎる手は六角の幅40pxで止め、いる県を中心に
function reachView() {
  layout(); // 寄せる前に盤の高さを確定させる（縦横比のずれを防ぐ）
  const r = svg.getBoundingClientRect(); if (!r.width || !r.height) return FULL;
  const n = E.steps(g), got = new Set([POS()]); let edge = [POS()];
  for (let i = 0; i < n; i++) { const nx = []; for (const p of edge) for (const q of E.NB[p]) if (!got.has(q)) { got.add(q); nx.push(q); } edge = nx; }
  const xs = [...got].map(p => CTR[p][0]), ys = [...got].map(p => CTR[p][1]), PAD = 36; // 六角の半分＋少し
  const x0 = Math.min(...xs) - PAD, x1 = Math.max(...xs) + PAD, y0 = Math.min(...ys) - PAD, y1 = Math.max(...ys) + PAD;
  const asp = r.width / r.height, HEX = Math.sqrt(3) * 31.5; // 六角の幅（盤の単位）
  const wMax = r.width * HEX / 40, wMin = r.width * HEX / 64; // 六角は40〜64px
  const fullW = Math.max(FULL[2], FULL[3] * asp);
  const w = Math.min(fullW, wMax, Math.max(wMin, x1 - x0, (y1 - y0) * asp)), h = w / asp;
  const fits = w >= x1 - x0 && h >= y1 - y0;
  const clamp = (c, lo, hi, s) => lo + s / 2 > hi - s / 2 ? (lo + hi) / 2 : Math.min(hi - s / 2, Math.max(lo + s / 2, c));
  let cx = fits ? (x0 + x1) / 2 : clamp(CTR[POS()][0], x0, x1, w), cy = fits ? (y0 + y1) / 2 : clamp(CTR[POS()][1], y0, y1, h);
  cx = clamp(cx, FULL[0], FULL[0] + FULL[2], w); cy = clamp(cy, FULL[1], FULL[1] + FULL[3], h); // 盤の外の余白を見せない
  // 収まらない手だけ、なぞる先を追う（pan）。先の県を真ん中に置く。端の県（沖縄・北海道など）でも寄せきれるよう、盤の端は越えてよい
  ZOOM = fits ? null : { at: c => [clamp(c[0], x0, x1, w) - w / 2, clamp(c[1], y0, y1, h) - h / 2, w, h],
    box: [x0, x1, y0, y1] }; // box＝端送りで盤を動かしてよい範囲（届く範囲の枠）
  return [cx - w / 2, cy - h / 2, w, h];
}
let ZOOM = null;
// 道の先へ盤を即時に動かす（動きの最中に指が別の県を通らないよう、アニメーションしない）。
// f＝指の盤上の位置。指がない（離した）ときは寄せきる。指があるときは、動かしたあとの指が先の県の中心から20以内
// （＝先の県の六角の内側）に収まる分までしか動かさない＝動いても指の下の県は変わらない
function pan(f) {
  if (!ZOOM || zooming) return;
  const T = CTR[tipOf()], to = ZOOM.at(T);
  if (Math.abs(VB[2] - to[2]) > 1) return;
  const dx = to[0] - VB[0], dy = to[1] - VB[1];
  let t = 1;
  if (f) { // |f−T＋t·d| ≤ 20 を満たす一番大きい t（0〜1）。満たす t がなければ動かさない
    const px = f[0] - T[0], py = f[1] - T[1], a = dx * dx + dy * dy, b = 2 * (px * dx + py * dy), c = px * px + py * py - 400;
    if (a < 1e-6) return;
    const D = b * b - 4 * a * c; if (D < 0) return;
    const t1 = (-b - Math.sqrt(D)) / (2 * a), t2 = (-b + Math.sqrt(D)) / (2 * a);
    t = Math.min(1, t2); if (t < 0 || t < t1) return;
  }
  if (t > 0) setVB([VB[0] + dx * t, VB[1] + dy * t, VB[2], VB[3]]);
}
// 盤の位置は「操作帯の上の空きの真ん中」のまま、操作帯の上の線だけを盤のすぐ下まで上げる。
// 縦長の画面で、盤の高さ＋上の余白（＝余りの半分）だけを盤に与え、残りは操作帯に回す（操作帯の中は下に空きができる）
const BAND = document.querySelector(".band");
let SETUP_H = null; // 始まるまでの線の位置（盤の高さ）
function layout() {

      NET.be.setSeat(NET.code, i, k === "空き" ? { kind: "空き" } : { kind: "コンピュータ", level: k }); };
    else if (s.kind === "空き") b.onclick = () => NET.be.takeSeat(NET.code, i);
    else b.disabled = true;
    if (off) { c.className = "off"; c.setAttribute("aria-hidden", "true"); b.disabled = true; b.tabIndex = -1; }
    box.appendChild(c);
  }
  if (host) { const sb = btn("始める", () => NET.be.update(NET.code, { state: "play" })); sb.disabled = !ready; }
  btn("抜ける", () => { leaveNet(); setup.mode = "here"; renderSetup(); }, "sub");
  requestAnimationFrame(fit);
}
if (DEBUG) window.__jintori = () => ({ net: NET && { code: NET.code, uid: NET.uid, applied: NET.applied, ui: NET.ui, desync: NET.desync, bad: NET.bad, host: isHost() },
  t: g && g.t, over: !!(g && g.over), score: g && g.score, fp: g && Net && Net.fingerprint(g), owner: g && g.owner, logs: LOGS.slice() });
renderSetup();
{ const code = sessionStorage.getItem("jintori.room"); // 再読み込み：同じ部屋に戻って最初から再生する
  if (code) netOpen(code).then(err => { if (err) { sessionStorage.removeItem("jintori.room"); netError(err); } }); }
</script>
